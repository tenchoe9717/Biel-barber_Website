<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biel Castro Barber | Links</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
    }

    /* ── Full-screen photo background ── */
    .bg {
      position: fixed;
      inset: 0;
      background: url('628213415_906683228433049_2908722986771400967_n.jpg') center center / cover no-repeat;
      filter: brightness(0.55);
      z-index: 0;
    }

    /* Dark gradient overlay — heavier at bottom for text legibility */
    .shade {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(0,0,0,0.25) 0%,
        rgba(0,0,0,0.15) 40%,
        rgba(0,0,0,0.7)  100%
      );
      z-index: 1;
    }

    /* ── Layout wrapper ── */
    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 2.75rem;
    }

    /* ── Top row: logo left, socials right ── */
    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 2rem;
    }

    /* Logo */
    .logo img {
      height: 72px;
      width: auto;
      filter: invert(1);
    }

    /* Social links stacked */
    .socials {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.55rem;
      padding-top: 0.25rem;
    }

    .social-link {
      font-size: clamp(0.65rem, 1.4vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      transition: color 0.2s, letter-spacing 0.2s;
      position: relative;
    }

    .social-link::after {
      content: '';
      position: absolute;
      left: 0; bottom: -2px;
      width: 0; height: 1px;
      background: #ff622b;
      transition: width 0.25s ease;
    }

    .social-link:hover {
      color: #ffffff;
      letter-spacing: 0.22em;
    }
    .social-link:hover::after { width: 100%; }

    /* ── Bottom: tagline ── */
    .tagline {
      color: #ffffff;
    }

    .tagline p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2.6rem, 7vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 540px) {
      .page { padding: 2rem 1.5rem; }
      .logo img { height: 54px; }
      .socials { gap: 0.45rem; }
    }

    @media (max-width: 380px) {
      .logo img { height: 44px; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="shade"></div>

  <div class="page">

    <!-- Top row -->
    <div class="top-row">
      <a href="index.html" class="logo" aria-label="Biel Castro Barber — Home">
        <img src="619123323_18112444498722320_1882993782832653147_n.jpg" alt="Biel Castro Barber" />
      </a>

      <nav class="socials" aria-label="Social links">
        <a href="https://instagram.com/biel88castro" target="_blank" rel="noopener" class="social-link">Instagram</a>
        <a href="https://facebook.com/bielcastrobarber" target="_blank" rel="noopener" class="social-link">Facebook</a>
        <a href="https://wa.me/17812043400" target="_blank" rel="noopener" class="social-link">WhatsApp</a>
      </nav>
    </div>

    <!-- Bottom tagline -->
    <div class="tagline">
      <p>Meet your best self<br>at Biel Castro</p>
    </div>

  </div>

</body>
</html>
